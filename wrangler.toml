# AMBIENT's Cloudflare Worker — deploy with:  npx wrangler deploy
#
# This is a SEPARATE worker from the NOUS one. It needs its own Durable
# Object binding and its own ALLOW_ORIGIN, and keeping them apart means a
# bad deploy here cannot take NOUS down.

name = "ambient-worker"
main = "ambient-worker.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated RSS URLs — the /feeds endpoint fetches and parses these
# server-side so the glasses stay CORS-clean. Edit freely.
#
# How much text a source gives you varies enormously, and it decides whether
# opening a headline is worth doing. Measured average summary length:
#   Guardian 1134  France24 317  NPR 162  NYT 157  CNN 116  BBC 109  AJ 101
# The BBC publishes exactly one sentence — that is the feed, not a parsing
# bug — so the Guardian leads here for anything you actually want to read.
#
# Rejected, with reasons, so they do not get retried:
#   ekathimerini.com  403 to any non-browser client, even with a User-Agent
#   apnews (rsshub)   403
#   feeds.reuters.com dead, the endpoint was retired
#   cbc.ca            times out from here
#   rss.dw.com        serves no pubDate, so it cannot be sorted by recency
FEEDS = "https://www.theguardian.com/international/rss,https://feeds.bbci.co.uk/news/world/rss.xml,https://feeds.npr.org/1001/rss.xml,https://www.aljazeera.com/xml/rss/all.xml,https://www.france24.com/en/rss"

# SECURITY: the 5-character room code is convenience pairing, NOT
# authentication, and this header is only honoured by browsers - curl ignores
# it. It must name the real Pages origin and must never be "*".
ALLOW_ORIGIN = "https://instantbook.github.io"

# The WebSocket relay for the phone companion. One Durable Object per room
# code. If Durable Objects are not available on your plan, delete BOTH of
# these blocks and the /ws endpoint alone stops working — /feeds and /radio
# are unaffected, so headlines and stations still load.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
