<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>AMBIENT</title>
<style>
/* ============================================================
   AMBIENT — instrument-HUD tokens (spec §11)
   v2 cockpit: center stage + peripheral rails + overview zoom
   ============================================================ */
:root{
  --bg:#000000;
  --ink:#E8F4F6;
  --dim:#7E9296;
  --faint:#313D40;
  --accent:#4FD4E8;
  --accent-soft:rgba(79,212,232,.14);
  --up:#3EE08C;
  --down:#FF5C5C;
  --warn:#FFB454;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:12px}
#net.off{color:var(--warn)}
/* ---------- cockpit ---------- */
/* full instrument bezel: squares on all four sides of the stage */
/* --tile / --gap are DERIVED AT RUNTIME by frameGeom() from the real
   viewport — this fallback only covers the first paint. The v9 bezel
   hardcoded 6/4/6/4 squares at clamp(118px,15.2vh,176px), which assumed
   a ~1080-tall CSS viewport. The Pocket TV reports 960x540 (1920x1080 at
   density 320), where 4 side tiles need 514px of a 252px rail and half of
   them silently clip under overflow:hidden. Slot counts are now computed
   to fit whatever viewport we actually get. */
:root{--tile:104px;--gap:14px}
#cockpit{flex:1;display:grid;gap:var(--gap);min-height:0;
  grid-template-areas:"t t t" "l s r" "b b b";
  grid-template-rows:var(--tile) 1fr var(--tile);
  grid-template-columns:var(--tile) 1fr var(--tile)}
#rail-top{grid-area:t}#rail-bottom{grid-area:b}
#rail-left{grid-area:l}#rail-right{grid-area:r}
#stage-wrap{grid-area:s}
.rail{display:flex;min-height:0;min-width:0;overflow:hidden;
  justify-content:space-between;align-items:center}
.rail-h{flex-direction:row}
.rail-v{flex-direction:column}
#stage-wrap{min-height:0;display:flex}
/* stage card */
#stage{position:relative;flex:1;border:1px solid var(--accent);
  border-radius:3px;padding:18px 22px 16px;overflow-y:auto;
  scrollbar-width:none;
  box-shadow:0 0 0 1px var(--accent),0 0 26px -8px var(--accent)}
#stage::-webkit-scrollbar{display:none}
#stage h2{font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.2em;color:var(--accent);margin-bottom:14px;
  display:flex;justify-content:space-between;gap:12px}
#stage-status{display:flex;gap:14px;color:var(--dim);
  letter-spacing:.08em;font-weight:400}
#stage-status span:empty{display:none}
#st-link,#st-audio{color:var(--accent)}
#stage::before,#stage::after{content:"";position:absolute;width:9px;
  height:9px;border-color:var(--accent);border-style:solid}
#stage::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
#stage::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
/* rail tiles */
.tile{position:relative;border:1px solid var(--faint);border-radius:3px;
  padding:8px 10px;overflow:hidden;width:var(--tile);height:var(--tile);
  flex:none;display:flex;flex-direction:column;cursor:pointer}
.tile.filler{border-style:dashed;opacity:.45;cursor:default}
/* the device browser navigates with a virtual cursor, so anything
   actionable needs a real hover affordance */
.tile:not(.filler):hover{border-color:var(--accent)}
#stage h2{cursor:pointer}
#stage-body [data-row]{cursor:pointer}
#stage-body [data-row]:hover{color:var(--accent)}
#st-full{color:var(--dim);letter-spacing:0}
/* ---------- tile face ----------
   A tile is an instrument, not a shrunken card. Every one renders the same
   shape — one short VALUE plus one LABEL — and every text run is clamped,
   so nothing is ever cut mid-word the way a raw headline or a wrapped
   price was. The card's full content belongs on the stage, not in here. */
.tile.filler .tbody{align-items:center;justify-content:center;
  color:var(--faint);font-size:14px;letter-spacing:.3em}
.tile h3{font-family:var(--mono);font-size:9px;font-weight:500;
  letter-spacing:.15em;color:var(--dim);margin-bottom:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.tile .tbody{font-size:12.5px;color:var(--dim);line-height:1.35;
  flex:1;min-height:0;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden}
/* the headline number / state word */
.tv{font-family:var(--mono);font-size:21px;font-weight:300;color:var(--ink);
  line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* word-shaped values ("ALL PANELS", "day-cyan") need to step down a size
   or they ellipsise inside a 118px tile */
.tv.sm{font-size:13px;letter-spacing:.03em}
.tl.sub{-webkit-line-clamp:1;opacity:.7;margin-top:2px;font-size:9px}
.tl{font-size:10px;letter-spacing:.07em;color:var(--dim);margin-top:4px;
  line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
/* stacked two-city rows (clock, weather) */
.t2+.t2{border-top:1px dotted var(--faint);padding-top:6px;margin-top:6px}
.t2 .r{display:flex;align-items:center;gap:7px;min-width:0}
.t2 .r .tv{font-size:17px}
.t2 .c{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;
  color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
/* label/value pairs (markets) */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kv+.kv{margin-top:6px}
.kv .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--dim)}
.kv .v{font-family:var(--mono);font-size:15px;color:var(--ink);
  white-space:nowrap}
/* source identity dots — shows what a tile holds without spelling it out */
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;max-height:14px;
  overflow:hidden}
.dots i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
/* sel = where the highlight is right now; staged = what the main window
   is showing. They are different states and must read differently. */
.tile.sel,.tile:focus{border-color:var(--accent);
  background:var(--accent-soft);outline:none}
.tile.sel h3,.tile:focus h3{color:var(--accent)}
.tile.staged{border-left:3px solid var(--accent)}
.tile.off{opacity:.32}
/* fullscreen: collapse the grid to the stage; rails stay in the DOM so
   renderCard() can keep refreshing their tiles behind the scenes */
#cockpit.full{grid-template-areas:"s";grid-template-rows:1fr;
  grid-template-columns:1fr}
#cockpit.full .rail{display:none}
/* overview mode */
/* Overview collapsed the columns but left grid-template-rows as
   "tile 1fr tile", so #overview - which declares no grid-area - auto-placed
   into the 118px top-rail row and spilled off the screen. Give the mode a
   single full-size cell and put the grid in it.
   (The old "#cockpit.overview #stage-wrap,{display:none}" rule had a stray
   comma, making the whole selector invalid; the working copy is below.) */
#cockpit.overview{grid-template-columns:1fr;grid-template-rows:1fr;
  grid-template-areas:"ov"}
#overview{display:none;min-height:0}
#cockpit.overview #overview{grid-area:ov;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,150px);justify-content:center;
  align-content:center;overflow-y:auto;scrollbar-width:none}
#cockpit.overview .rail,#cockpit.overview #stage-wrap{display:none}
#overview .tile{width:150px;height:150px}
/* ---------- shared data typography ---------- */
.big{font-family:var(--mono);font-size:38px;font-weight:300;
  letter-spacing:-.01em;line-height:1}
.date-line{font-size:14px;color:var(--ink);margin-top:6px;
  letter-spacing:.04em}
.med{font-family:var(--mono);font-size:22px;font-weight:400}
.lbl{font-size:12px;color:var(--dim)}
.unit{font-size:.45em;color:var(--dim);font-weight:400}
.dual{display:flex;gap:28px;justify-content:space-between}
.dual>div{flex:1;min-width:0}
.dual>div+div{border-left:1px solid var(--faint);padding-left:24px}
.row{display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;border-bottom:1px dotted var(--faint);gap:10px}
.row:last-child{border-bottom:none}
.row .val{font-family:var(--mono);font-size:16px}
.delta-up{color:var(--up)}.delta-down{color:var(--down)}
.state{color:var(--dim);font-size:13px;line-height:1.6}
.state b{color:var(--warn);font-weight:500}
.hl{padding:8px 0;border-bottom:1px dotted var(--faint);font-size:15px;
  line-height:1.45}
.hl:last-child{border-bottom:none}
.hl .src{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--dim);display:block;margin-top:2px}
.hl.sel{color:var(--accent)}
input[type=text]{width:100%;background:transparent;color:var(--ink);
  border:1px solid var(--faint);border-radius:2px;padding:7px 9px;
  font-family:var(--mono);font-size:13px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  padding:4px 11px;border:1px solid var(--faint);border-radius:2px;
  color:var(--dim)}
.chip.on{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
.arc .face{stroke:var(--faint);fill:none}
.arc .hand{stroke:var(--accent);fill:none;stroke-linecap:round}
/* narrow fallback (phone preview) */
@media(max-width:760px){
  :root{--tile:64px}
  #rail-left,#rail-right{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="cockpit">
    <div class="rail rail-h" id="rail-top"></div>
    <div class="rail rail-v" id="rail-left"></div>
    <div id="stage-wrap"><section id="stage">
      <h2><span id="stage-title"></span><span id="stage-status">
        <span id="st-link"></span><span id="st-audio"></span>
        <span id="net"></span><span id="st-full"></span></span></h2>
      <div class="body" id="stage-body"></div>
    </section></div>
    <div class="rail rail-v" id="rail-right"></div>
    <div class="rail rail-h" id="rail-bottom"></div>
    <div id="overview"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   AMBIENT v2 — cockpit shell (built for a large worn display)
   Everything visible at once: peripheral rails + one dominant
   stage. BACK zooms to an overview grid of all cards.
   Cards unchanged from the §3 contract; renderCompact() is the
   one optional addition (rail/overview tile view).
   ============================================================ */
const APP_VERSION="v28";

/* ---------------- theme bus ---------------- */
const THEMES={
  "day-cyan":     {accent:"#4FD4E8",soft:"rgba(79,212,232,.14)"},
  "dim-amber":    {accent:"#FFB454",soft:"rgba(255,180,84,.12)"},
  "sea":          {accent:"#3FBFA8",soft:"rgba(63,191,168,.13)"},
  "high-contrast":{accent:"#FFFFFF",soft:"rgba(255,255,255,.16)"}
};
let themeName=localStorage.getItem("ambient.theme")||"day-cyan";
function applyTheme(name){
  if(!THEMES[name])name="day-cyan";
  themeName=name;
  const t=THEMES[name];
  document.documentElement.style.setProperty("--accent",t.accent);
  document.documentElement.style.setProperty("--accent-soft",t.soft);
  localStorage.setItem("ambient.theme",name);
  CARDS.forEach(c=>{try{c.onTheme&&c.onTheme(ctxFor(c),name)}catch(e){}});
}

/* ---------------- audio bus (spec §8) ----------------
   ONE audio pipeline for the whole app. Any card plays through it;
   the visualizer reads it without knowing the source.
   CORS-clean streams get a real AnalyserNode; others play natively
   (routing a non-CORS stream through WebAudio would MUTE it) and
   the analyser abstraction returns synthetic motion instead.     */
const audioBus=(()=>{
  const el=(typeof Audio!=="undefined")?new Audio():null;
  let ac=null,analyser=null,wired=false,current=null,synthT=0,bins=null;
  /* a stream that will not start must say so — mixed-content blocking and
     dead stations both fail as a silently rejected play() promise */
  let failedUrl=null;
  function fail(item){
    if(!item||current!==item)return;
    failedUrl=item.url;current=null;
    emit("audio",{state:"error",item});
  }
  if(el)el.addEventListener("error",()=>fail(current));
  function wire(){ /* once, only for cors-clean sources */
    if(wired||!el)return;
    try{
      /* latencyHint is the whole ballgame on a box like this. The default
         is "interactive", which asks for the SMALLEST buffer the platform
         will give — right for a game, wrong for radio, and on a low-power
         Amlogic TV box any scheduling jitter then under-runs the render
         quantum and you hear it as stutter even with the CPU 78% idle
         (measured: 313% of 400% idle while stuttering). "playback" asks
         for the largest buffer instead; we do not care about latency when
         the nearest thing to an input is pressing OK on a station. */
      ac=new (window.AudioContext||window.webkitAudioContext)(
        {latencyHint:"playback"});
      const src=ac.createMediaElementSource(el);
      analyser=ac.createAnalyser();
      /* 128 gave only 64 bins - far too coarse once the bars got
         narrow. 1024 yields 512, and smoothing rides out the jitter
         that finer bins expose. */
      analyser.fftSize=1024;analyser.smoothingTimeConstant=0.75;
      src.connect(analyser);analyser.connect(ac.destination);
      wired=true;
    }catch(e){analyser=null}
  }
  return{
    play(item){ /* {label,url,cors} */
      if(!el)return false;
      try{
        if(item.cors){el.crossOrigin="anonymous";wire();
          if(ac&&ac.state==="suspended")ac.resume()}
        else el.crossOrigin=null;
        failedUrl=null;
        el.src=item.url;
        current=item;
        const p=el.play();
        if(p&&p.catch)p.catch(()=>fail(item));
        emit("audio",{state:"play",item});
        return true;
      }catch(e){return false}
    },
    failed:()=>failedUrl,
    stop(){if(el){try{el.pause();el.src=""}catch(e){}}
      current=null;emit("audio",{state:"stop"})},
    toggle(item){
      if(current&&item&&current.url===item.url){this.stop();return false}
      return this.play(item);
    },
    current:()=>current,
    playing:()=>!!(current&&el&&!el.paused),
    /* fills arr 0..1; returns true if real FFT, false if synthetic */
    getLevels(arr){
      if(current&&wired&&analyser&&current.cors){
        try{
          /* reused, not reallocated — this runs every animation frame and
             a fresh typed array per frame is pure GC pressure on the same
             main thread the audio graph is scheduled from */
          if(!bins||bins.length!==analyser.frequencyBinCount)
            bins=new Uint8Array(analyser.frequencyBinCount);
          const raw=bins;
          analyser.getByteFrequencyData(raw);
          /* Log-spaced bands. A linear bin->bar map crams almost all
             musical energy into the first few bars and leaves the rest
             of the display dead; each bar now covers an exponentially
             wider slice, which is what makes a spectrum look "right".
             Peak (not mean) across the slice keeps it lively. */
          const n=arr.length,len=raw.length;
          let sum=0;
          for(let i=0;i<n;i++){
            const lo=Math.floor(Math.pow(len,i/n));
            const hi=Math.min(len,Math.max(lo+1,
              Math.floor(Math.pow(len,(i+1)/n))));
            let mx=0;
            for(let j=lo;j<hi;j++)if(raw[j]>mx)mx=raw[j];
            const v=mx/255;
            arr[i]=v;sum+=v;
          }
          if(sum>0.01)return true; /* real signal present */
        }catch(e){}
      }
      /* synthetic: gentle breathing when playing, near-still when idle */
      synthT+=0.045;
      const amp=this.playing()?0.55:0.12,m=arr.length;
      for(let i=0;i<m;i++){
        const x=i/m;                       /* position, not bin index, so
                                              this reads the same at any
                                              bar count */
        arr[i]=amp*(0.30+0.70*
          Math.abs(Math.sin(synthT*1.7+x*7.5))*
          (0.55+0.45*Math.sin(synthT*0.5+x*2.1)))*
          (1-0.45*x);                      /* gentle high-end rolloff, the
                                              shape real music has */
      }
      return false;
    }
  };
})();


/* ---------------- scenes (spec §5) ----------------
   A scene = palette + which cards are active + which card takes
   the stage + optional per-card config (delivered via onScene).
   Built-ins below; user scenes merge from localStorage now and
   from /AMBIENT/scenes/ once the bridge lands (step 5).        */
const SCENES=[
  {id:"all",name:"ALL PANELS",palette:"day-cyan",stage:"weather",cards:{}},
  {id:"morning",name:"MORNING",palette:"day-cyan",stage:"weather",
    cards:{vis:{active:false}}},
  {id:"flight",name:"FLIGHT",palette:"dim-amber",stage:"vis",
    cards:{radio:{active:false},markets:{active:false},
      headlines:{config:{offlineBatch:true}}}},
  {id:"evening",name:"EVENING",palette:"sea",stage:"radio",
    cards:{markets:{active:false},headlines:{active:false},
      weather:{active:false}}}
];
function allScenes(){
  let user=[];
  try{user=JSON.parse(localStorage.getItem("ambient.scenes")||"[]")}
  catch(e){}
  return SCENES.concat(Array.isArray(user)?user:[]);
}
let currentScene=localStorage.getItem("ambient.scene")||"all";
function applyScene(sc){
  if(!sc)return;
  currentScene=sc.id;
  localStorage.setItem("ambient.scene",sc.id);
  applyTheme(sc.palette||"day-cyan");
  CARDS.forEach(c=>{
    const cfg=(sc.cards&&sc.cards[c.id])||{};
    c._active=cfg.active!==false||c.id==="scenes"||c.pinned===true;
    try{c.onScene&&c.onScene(ctxFor(c),cfg.config||{})}catch(e){}
  });
  stageId=sc.stage;
  if(!frameCards().some(c=>c.id===stageId))
    stageId=(frameCards()[0]||{}).id;
  focusSel(stageId);
  mode="bezel";
  render();
}

const WORKER_BASE=()=>localStorage.getItem("ambient.worker")||"";
const cacheGet=k=>{try{const v=localStorage.getItem("ambient.data."+k);
  return v?JSON.parse(v):null}catch(e){return null}};
const cachePut=(k,d)=>{try{localStorage.setItem("ambient.data."+k,
  JSON.stringify({t:Date.now(),d}))}catch(e){}};
async function fetchSource(card,src){
  let url;
  if(src.origin==="direct")url=src.path;
  else if(src.origin==="worker"){
    const base=WORKER_BASE();
    if(!base)throw new Error("no-worker");
    url=base.replace(/\/$/,"")+src.path;
  }else if(src.origin==="local"){
    url="http://localhost:8765"+src.path;
  }else throw new Error("unknown-origin");
  const r=await fetch(url,{signal:AbortSignal.timeout?
    AbortSignal.timeout(12000):undefined});
  if(!r.ok)throw new Error("http-"+r.status);
  const d=await r.json();
  cachePut(src.key,d);
  return d;
}

/* ---------------- companion link (spec §10) ----------------
   Phone pairs by 5-char room code over a WebSocket relay on the
   Worker (/ws?room=CODE&role=display|remote). Phone input flows
   through the same route() as the D-pad; nothing card-specific. */
const companion=(()=>{
  let ws=null,state="off",retry=null;
  let code=localStorage.getItem("ambient.room");
  if(!code){code=Array.from({length:5},()=>
    "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)])
    .join("");localStorage.setItem("ambient.room",code)}
  function setState(v){state=v;
    const el=document.getElementById("st-link");
    if(el)el.textContent=v==="on"?"LINK "+code:"";
    emit("companion",{state:v,code});}
  function handle(msg){
    let m;try{m=JSON.parse(msg)}catch(e){return}
    if(m.t==="key"&&["up","down","left","right","enter","back"]
      .includes(m.k))route(m.k);
    else if(m.t==="text"){
      const c=staged();
      if(c&&c.onText){try{c.onText(ctxFor(c),String(m.v||""))}catch(e){}}
    }
    else if(m.t==="action"){
      const v=String(m.id||"");
      if(v.startsWith("scene."))
        applyScene(allScenes().find(x=>x.id===v.slice(6)));
      else if(v.startsWith("theme."))applyTheme(v.slice(6));
      else if(v.startsWith("stage.")){
        const id=v.slice(6);
        if(frameCards().some(c=>c.id===id)){
          stageId=id;focusSel(id);mode="stage";render();
        }
      }
      /* the phone is the only place fullscreen is reachable in one tap */
      else if(v==="view.full"){mode="full";render()}
      else if(v==="view.bezel"){mode="bezel";render()}
      else if(v==="view.overview"){
        mode="overview";
        ovSel=Math.max(0,visibleCards().findIndex(c=>c.id===stageId));
        render();
      }
    }
    else if(m.t==="inject"){
      const target=CARDS.find(c=>c.id===(m.target||""))||
        CARDS.find(c=>(c.accepts||[]).includes(m.kind));
      if(target&&target.onInject)
        try{target.onInject(ctxFor(target),
          {kind:m.kind,v:m.v})}catch(e){}
    }
  }
  function connect(){
    const base=WORKER_BASE();
    if(!base||typeof WebSocket==="undefined"){setState("off");return}
    try{
      const url=base.replace(/^http/,"ws").replace(/\/$/,"")+
        "/ws?room="+code+"&role=display";
      ws=new WebSocket(url);
      ws.onopen=()=>setState("on");
      ws.onmessage=e=>handle(e.data);
      ws.onclose=()=>{setState("off");
        clearTimeout(retry);retry=setTimeout(connect,5000)};
      ws.onerror=()=>{try{ws.close()}catch(e){}};
    }catch(e){setState("off")}
  }
  return{connect,code:()=>code,state:()=>state};
})();

/* ---------------- shell state ----------------
   The bezel is a launcher of FIXED tiles, not a carousel. Before, ◄►
   rotated the whole ring so every tile changed position on every press,
   which made the frame impossible to build spatial memory for. Now each
   card keeps a permanent slot, ◄► walk a highlight around the perimeter
   (◄ counterclockwise, ► clockwise), and OK loads the highlighted card
   into the main window — pressing OK on the card that is already loaded
   expands it to fullscreen.                                            */
let CARDS=[];
let stageId=null;           /* id of the card in the main window */
let selIdx=0;               /* highlighted slot, clockwise from top-left */
let mode="bezel";           /* "bezel" | "stage" | "full" | "overview" */
let ovSel=0;                /* overview selection */
let dblTimer=null,dblId=null;  /* pending single-press, awaiting a double */
let online=navigator.onLine;
const bus={};
function emit(ev,p){(bus[ev]||[]).forEach(f=>{try{f(p)}catch(e){}})}
function on(ev,f){(bus[ev]=bus[ev]||[]).push(f)}

function ctxFor(card){
  return{
    fetch:async key=>{
      const src=(card.sources||[]).find(s=>s.key===key);
      if(!src)throw new Error("undeclared-source:"+key);
      const cached=cacheGet(key);
      if(!online){if(cached)return cached.d;throw new Error("offline")}
      try{return await fetchSource(card,src)}
      catch(e){if(cached)return cached.d;throw e}
    },
    cachedOnly:key=>{const c=cacheGet(key);return c?c.d:null},
    online:()=>online,
    caps:()=>({dpad:true,keyboard:true,pointer:false,
      companion:companion.state()==="on"}),
    theme:()=>themeName,setTheme:applyTheme,
    audio:audioBus,
    storage:{
      get:(k,dflt)=>{try{const v=localStorage.getItem(
        "ambient.card."+card.id+"."+k);
        return v===null?dflt:JSON.parse(v)}catch(e){return dflt}},
      set:(k,v)=>{try{localStorage.setItem(
        "ambient.card."+card.id+"."+k,JSON.stringify(v))}catch(e){}}
    },
    emit,on,
    rerender:()=>renderCard(card)
  };
}

/* ---------------- registry ---------------- */
function registerCards(list){
  CARDS=list.filter(c=>{
    const ok=c&&c.id&&c.pane&&typeof c.render==="function";
    if(!ok)console.warn("AMBIENT: card rejected",c&&c.id);
    return ok;
  }).sort((a,b)=>(a.order||99)-(b.order||99));
  CARDS.forEach(c=>{try{c.init&&c.init(ctxFor(c))}catch(e){
    console.warn("init fail",c.id,e)}});
}
function activeCards(){return CARDS.filter(c=>c._active!==false)}
function ringCards(){return activeCards().filter(c=>!c.pinned)}
function pinnedCards(){return activeCards().filter(c=>c.pinned)}
function visibleCards(){return CARDS.slice()}
/* frameCards() is the authoritative slot order: pinned first (they hold
   the corner), then the rest, laid out clockwise from the top-left. It is
   also the order ◄► walk, so screen position and key order always agree.
   "pinned" now means "fixed slot + immune to scene deactivation" — such a
   card can still be opened in the main window like any other. */
function frameCards(){return pinnedCards().concat(ringCards())}
function staged(){
  const all=frameCards();
  return all.find(c=>c.id===stageId)||all[0]||CARDS[0];
}
function selectedCard(){return frameCards()[selIdx]}
function stagedIs(card){const s=staged();return !!s&&s.id===card.id}
/* Spatial navigation.
   A strict clockwise ring is correct on the top edge and reads as inverted
   everywhere else: continuing clockwise along the bottom means travelling
   visually LEFT, and up the left rail means travelling UP — so ► appeared
   to go left and ◄ to go right. Arrows now follow screen geometry, which is
   what every TV UI does and what the eye expects on a four-sided bezel. */
function tileCentre(c){
  const el=c&&document.getElementById("fr-"+c.id);
  if(!el)return null;
  const r=el.getBoundingClientRect();
  if(!r.width&&!r.height)return null;      /* hidden, e.g. fullscreen */
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}
function moveSpatial(dir){
  const cards=frameCards();
  const from=tileCentre(cards[selIdx]);
  if(!from)return false;
  const horiz=(dir==="left"||dir==="right");
  let best=-1,bestScore=Infinity;
  cards.forEach((c,i)=>{
    if(i===selIdx)return;
    const p=tileCentre(c);
    if(!p)return;
    const dx=p.x-from.x,dy=p.y-from.y;
    if(dir==="left"&&dx>=-2)return;
    if(dir==="right"&&dx<=2)return;
    if(dir==="up"&&dy>=-2)return;
    if(dir==="down"&&dy<=2)return;
    /* distance along the axis travelled, with drift across it penalised so
       a tile straight ahead beats a nearer one off to the side */
    const along=Math.abs(horiz?dx:dy),cross=Math.abs(horiz?dy:dx);
    const score=along+cross*2.5;
    if(score<bestScore){bestScore=score;best=i}
  });
  if(best<0)return false;
  selIdx=best;return true;
}
function moveSel(d){
  const n=frameCards().length;
  if(n)selIdx=((selIdx+d)%n+n)%n;
}
function focusSel(id){
  const i=frameCards().findIndex(c=>c.id===id);
  if(i>=0)selIdx=i;
}

/* ---------------- render: cockpit ---------------- */
/* tabindex makes each tile a real focus target. TV browsers fall back to a
   virtual mouse cursor when a page offers nothing focusable, and drive the
   D-pad as spatial navigation when it does — so being focusable is what
   keeps the remote talking to the app instead of to a floating dot. It
   also gives keyboards and screen readers something to land on. */
/* One tile face for every card: a short value, an optional label, optional
   identity dots. Long word-values step down a size rather than ellipsising. */
function face(value,label,opts){
  opts=opts||{};
  const v=String(value==null?"—":value);
  const sm=v.length>7||opts.small;
  return "<div class='tv"+(sm?" sm":"")+"'"+
    (opts.color?" style='color:"+opts.color+"'":"")+">"+v+"</div>"+
    (label?"<div class='tl'>"+label+"</div>":"")+
    (opts.sub?"<div class='tl sub'>"+opts.sub+"</div>":"")+
    (opts.dots&&opts.dots.length
      ? "<div class='dots'>"+opts.dots.slice(0,8).map(c=>
          "<i style='background:"+c+"'></i>").join("")+"</div>"
      : "");
}
/* tileTitle lets a card keep a rich stage header ("EDMONTON · ATHENS")
   while the 118px tile shows something that actually fits */
function tileHTML(card,sel,tag,isStaged){
  return "<div class='tile"+(sel?" sel":"")+(isStaged?" staged":"")+
    "' id='"+tag+"-"+card.id+"' tabindex='0'"+
    "><h3>"+(card.tileTitle||card.title||card.id)+"</h3><div class='tbody'>"+
    compactOf(card)+"</div></div>";
}
function compactOf(card){
  try{
    if(card.renderCompact)
      return card.renderCompact(ctxFor(card),card._data||{})||"";
    return "<span class='lbl'>—</span>";
  }catch(e){return "<span class='lbl'>—</span>"}
}
/* ---------- frame geometry ----------
   The bezel used to be hardcoded at 20 squares (6/4/6/4) sized by a CSS
   clamp tuned for a ~1080-tall viewport. On the Pocket TV the CSS viewport
   is 960x540 (1920x1080 at density 320), so a 4-tile side rail needed
   514px inside a 252px row and quietly clipped half its tiles.
   Now tile size and per-edge slot counts are both derived from the real
   viewport, so the ring always fits exactly and nothing is cut off.
   Everything downstream reads these numbers rather than assuming 20. */
const GAP=14,PAD=12;
function frameGeom(){
  const vw=innerWidth,vh=innerHeight;
  /* 118px is a hard floor, not a preference: renderCompact() content (the
     clock's two icon+time+arc rows especially) is authored for it and gets
     clipped by .tile{overflow:hidden} below that. Shrinking tiles to gain
     slots trades a clipped rail for clipped tile contents — so hold the
     floor and let the slot COUNT absorb small viewports instead. */
  const tile=Math.round(Math.max(118,Math.min(176,vh*0.19)));
  /* a side rail only gets the stage row: total height minus both
     horizontal rails, the page padding and the two grid gaps */
  const railH=vh-2*PAD-2*tile-2*GAP;
  const fit=(span,t)=>Math.max(1,Math.floor((span+GAP)/(t+GAP)));
  const perSide=fit(railH,tile);
  const perRow=Math.max(3,fit(vw-2*PAD,tile));
  const root=document.documentElement.style;
  root.setProperty("--tile",tile+"px");
  root.setProperty("--gap",GAP+"px");
  return{tile,perRow,perSide,total:2*perRow+2*perSide};
}
/* Spread the real cards evenly around the ring instead of packing them into
   the first slots. Packed, 10 cards in 18 slots filled the entire top row
   and the right rail and left the whole left rail plus six of seven bottom
   slots as fillers — so half the bezel was dead space that ◄► skipped over,
   and the frame looked lopsided. Cards stay in clockwise order, just spaced. */
function layoutSlots(cards,total){
  const out=new Array(total).fill(null);
  if(!cards.length||total<=0)return out;
  const step=total/cards.length;
  cards.forEach((c,i)=>{
    let p=Math.round(i*step)%total;
    while(out[p])p=(p+1)%total;   /* rounding collision: take the next free */
    out[p]=c;
  });
  return out;
}
function fillerHTML(n){
  /* empty instrument bays: present enough to keep the bezel symmetrical,
     quiet enough not to compete with the tiles that hold something */
  return "<div class='tile filler'><h3>&nbsp;</h3>"+
    "<div class='tbody'>·</div></div>";
}
function render(){
  const cp=document.getElementById("cockpit");
  const center=staged();
  if(mode==="overview"){
    cp.classList.remove("full");
    cp.classList.add("overview");
    const ov=document.getElementById("overview");
    ov.innerHTML=visibleCards().map((c,i)=>{
      const t=tileHTML(c,i===ovSel,"ov",c.id===stageId);
      return c._active===false?
        t.replace("class='tile","class='tile off"):t;
    }).join("");
  }else{
    cp.classList.remove("overview");
    /* fullscreen collapses the grid to the stage alone; the rails stay in
       the DOM (so renderCard can still refresh their tiles) but are hidden */
    cp.classList.toggle("full",mode==="full");
    const F=frameGeom();
    const cards=frameCards();
    /* every card holds a permanent slot — the highlight moves, not the tiles */
    const plan=layoutSlots(cards,F.total);
    const slots=plan.map((c,i)=>c
      ?tileHTML(c,mode==="bezel"&&cards.indexOf(c)===selIdx,"fr",
        c.id===stageId)
      :fillerHTML(i));
    let i=0;
    const top=slots.slice(i,i+=F.perRow);
    const right=slots.slice(i,i+=F.perSide);
    const bottom=slots.slice(i,i+=F.perRow).reverse();
    const left=slots.slice(i,i+=F.perSide).reverse();
    document.getElementById("rail-top").innerHTML=top.join("");
    document.getElementById("rail-right").innerHTML=right.join("");
    document.getElementById("rail-bottom").innerHTML=bottom.join("");
    document.getElementById("rail-left").innerHTML=left.join("");
    document.getElementById("stage-title").textContent=
      center?(center.title||center.id):"";
    const ff=document.getElementById("st-full");
    if(ff)ff.textContent=mode==="full"?"⤡":"⛶";
    if(center)renderCard(center);
    focusTile();
  }
}
function renderCard(card){
  /* stage body if this card is the one loaded in the main window */
  if(mode!=="overview"&&stagedIs(card)){
    const host=document.getElementById("stage-body");
    try{
      const out=card.render(ctxFor(card),card._data||{});
      if(typeof out==="string")host.innerHTML=out;
      else if(out instanceof Node){host.innerHTML="";host.appendChild(out)}
    }catch(e){host.innerHTML="<div class='state'>render error</div>";
      console.warn("render fail",card.id,e)}
    /* Cards re-render their whole list on every ▲▼, so the highlighted row
       has to be scrolled back into view or it walks off the bottom of the
       stage and you lose track of the selection entirely. "nearest" keeps
       the list still while the selection is already visible. */
    const cur=host.querySelector(".sel");
    if(cur&&cur.scrollIntoView){
      try{cur.scrollIntoView({block:"nearest"})}catch(e){}
    }
  }
  /* refresh this card's tile wherever it appears */
  ["fr","ov"].forEach(tag=>{
    const t=document.querySelector("#"+tag+"-"+card.id+" .tbody");
    if(t)t.innerHTML=compactOf(card);
  });
}

/* ---------------- refresh scheduler ---------------- */
async function refreshCard(card,force){
  if(!card.sources||!card.sources.length)return;
  const due=force||!card._last||
    (card.refresh&&(Date.now()-card._last)/1000>=card.refresh);
  if(!due)return;
  card._last=Date.now()+Math.floor(Math.random()*4000);
  const data={};
  await Promise.all(card.sources.map(async s=>{
    try{data[s.key]=await ctxFor(card).fetch(s.key)}
    catch(e){data[s.key]=null;data[s.key+".err"]=e.message}
  }));
  card._data=data;
  renderCard(card);
}
/* cockpit shows every card at once — all cards stay on cadence */
setInterval(()=>{CARDS.forEach(c=>refreshCard(c,false))},5000);

/* ---------------- online state ---------------- */
function setOnline(v){
  online=v;
  const el=document.getElementById("net");
  el.textContent=v?"":"OFFLINE";
  el.className=v?"":"off";
  if(v)CARDS.forEach(c=>refreshCard(c,true));
  else render();
}
addEventListener("online",()=>setOnline(true));
addEventListener("offline",()=>setOnline(false));

/* the bezel is derived from the viewport, so re-lay it out whenever that
   changes — TV browsers resize when their chrome shows/hides */
let _rz=null;
addEventListener("resize",()=>{clearTimeout(_rz);
  _rz=setTimeout(()=>render(),120)});

/* ---------------- input router ----------------
   bezel:    arrows move to the nearest tile · OK open
             (OK again on the open tile = fullscreen) · BACK overview
   main/full: ▲▼/OK act inside the card · ◄► move on · BACK bezel
   overview:  arrows select · OK open · BACK bezel            */
addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT"){
    if(e.key==="Escape"||e.key==="GoBack"){e.target.blur();e.preventDefault()}
    return;
  }
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",
    ArrowDown:"down",Enter:"enter",Escape:"back",Backspace:"back",
    GoBack:"back",BrowserBack:"back"};
  const k=map[e.key];if(!k)return;
  e.preventDefault();
  route(k);
});
/* ---------------- pointer input ----------------
   The Pocket TV's browser drives pages with a virtual mouse cursor and
   swallows the D-pad, so arrow keys never reach us there. The bezel must
   therefore be fully operable by pointer as well: hover moves the
   highlight, a click opens, and a click on the already-open card's tile
   expands it — the same contract as ◄► and OK.                        */
function tileCardId(el){return (el.id||"").replace(/^(fr|ov)-/,"")}
function paintSel(){
  /* class-only repaint: a full render() during mouseover would replace the
     element under the cursor and retrigger this handler */
  const cur=frameCards()[selIdx];
  document.querySelectorAll("#cockpit .tile").forEach(t=>{
    t.classList.toggle("sel",
      mode==="bezel"&&!!cur&&tileCardId(t)===cur.id);
  });
}
/* Keep DOM focus on the highlighted tile. Our keydown handler calls
   preventDefault(), so the browser skips its own spatial navigation and
   this stays the single source of truth — no double-stepping. */
let _settingFocus=false;
function focusTile(){
  if(mode!=="bezel")return;
  const a=document.activeElement;
  if(a&&a.tagName==="INPUT")return;      /* never steal from a text field */
  const c=frameCards()[selIdx];
  if(!c)return;
  const el=document.getElementById("fr-"+c.id);
  if(el&&el!==a){
    _settingFocus=true;   /* our own focus must not bounce back through focusin */
    try{el.focus({preventScroll:true})}catch(e){try{el.focus()}catch(e2){}}
    _settingFocus=false;
  }
}
/* if focus arrives some other way (click, browser nav), follow it */
document.addEventListener("focusin",e=>{
  if(mode!=="bezel"||_settingFocus)return;
  const t=e.target;if(!t||!t.closest)return;
  const tile=t.closest("#cockpit .tile");
  if(!tile||tile.classList.contains("filler"))return;
  const i=frameCards().findIndex(c=>c.id===tileCardId(tile));
  if(i>=0&&i!==selIdx){selIdx=i;paintSel()}
});
function openCard(c){
  if(!c)return;
  if(c._active===false)c._active=true;
  if(mode==="overview"){stageId=c.id;focusSel(c.id);mode="stage"}
  else if(c.id===stageId)mode="full";
  else{stageId=c.id;focusSel(c.id);mode="stage"}
  render();
}
document.addEventListener("click",e=>{
  /* detail===0 means the browser synthesised this click from a keypress on
     a focused element; route() already handled that key, and acting again
     would turn one OK into open-then-fullscreen */
  if(e.detail===0)return;
  const t=e.target;if(!t||!t.closest)return;
  /* a row a card marked pickable — pointer equivalent of ▲▼ then OK */
  const row=t.closest("#stage-body [data-row]");
  if(row){
    const c=staged(),i=+row.getAttribute("data-row");
    if(c&&c.onPick){try{c.onPick(ctxFor(c),i)}catch(err){}}
    return;
  }
  /* the stage header is the one region no card draws into, so it is a
     safe permanent target for the fullscreen toggle */
  if(t.closest("#stage h2")){
    mode=(mode==="full")?"bezel":"full";render();return;
  }
  const tile=t.closest(".tile");
  if(tile&&!tile.classList.contains("filler")){
    const c=CARDS.find(x=>x.id===tileCardId(tile));
    if(!c)return;
    /* the browser hands us detail===2 on the second click of a double, so
       the pointer gets the same shortcut as a double OK with no timer */
    if(e.detail>=2&&c.onToggle){
      try{c.onToggle(ctxFor(c))}catch(err){}
      render();return;
    }
    openCard(c);
  }
});
document.addEventListener("mouseover",e=>{
  if(mode!=="bezel")return;
  const t=e.target;if(!t||!t.closest)return;
  const tile=t.closest("#cockpit .tile");
  if(!tile||tile.classList.contains("filler"))return;
  const i=frameCards().findIndex(c=>c.id===tileCardId(tile));
  if(i>=0&&i!==selIdx){selIdx=i;paintSel()}
});

function route(k){
  if(mode==="overview"){
    /* columns must match what the grid actually rendered (auto-fill at
       150px + gap), or ▲▼ jump by the wrong stride */
    const n=visibleCards().length;
    const cols=Math.max(1,Math.min(n,
      Math.floor((innerWidth-2*PAD+GAP)/(150+GAP))));
    if(k==="left"&&ovSel>0)ovSel--;
    else if(k==="right"&&ovSel<n-1)ovSel++;
    else if(k==="up"&&ovSel-cols>=0)ovSel-=cols;
    else if(k==="down"&&ovSel+cols<n)ovSel+=cols;
    else if(k==="enter"){
      const card=visibleCards()[ovSel];
      if(!card)return;
      if(card._active===false)card._active=true; /* ad-hoc reactivate */
      stageId=card.id;focusSel(card.id);mode="stage";
    }
    else if(k==="back")mode="bezel";
    render();return;
  }

  /* --- main window has focus (loaded or fullscreen) --- */
  if(mode==="stage"||mode==="full"){
    if(k==="back"){mode="bezel";render();return}
    if(k==="left"||k==="right"){
      moveSel(k==="left"?-1:1);
      /* fullscreen browses card-to-card in place; the windowed view hands
         focus back to the bezel so you can keep looking around */
      if(mode==="full")stageId=selectedCard().id; else mode="bezel";
      render();return;
    }
    const c=staged();
    if(c&&c.onKey){try{if(c.onKey(ctxFor(c),k)===true)return}catch(e){}}
    /* The router consumes every arrow, so a card's text field was
       unreachable with a remote — the Worker URL, the LAUNCH "add site" box
       and the CLAUDE prompt could only be filled from the phone. If the card
       did not want ▼, hand it to the first text field in the stage; the
       keydown handler above already lets BACK blur out again. */
    if(k==="down"){
      const inp=document.querySelector("#stage-body input[type=text]");
      if(inp&&document.activeElement!==inp){
        try{inp.focus({preventScroll:true})}catch(e){try{inp.focus()}catch(e2){}}
        if(inp.scrollIntoView)try{inp.scrollIntoView({block:"nearest"})}catch(e){}
        return;
      }
    }
    return;
  }

  /* --- bezel has focus: walk the tiles, OK opens --- */
  if(k==="left"||k==="right"||k==="up"||k==="down"){
    if(moveSpatial(k))render();
    return;
  }
  if(k==="enter"){
    const c=selectedCard();
    if(!c)return;
    /* OK on the card that is already loaded expands it instead of
       reloading it — that is the only route to fullscreen from the remote */
    const single=()=>{
      if(c.id===stageId)mode="full";
      else{stageId=c.id;mode="stage"}
      render();
    };
    /* A card can offer a double-press shortcut (RADIO: start/stop the
       selected station without going in). Distinguishing one press from two
       means holding the first briefly, so ONLY cards that define onToggle
       pay that delay — every other tile still opens instantly. */
    if(!c.onToggle){single();return}
    if(dblId===c.id&&dblTimer){
      clearTimeout(dblTimer);dblTimer=null;dblId=null;
      try{c.onToggle(ctxFor(c))}catch(e){}
      render();return;
    }
    clearTimeout(dblTimer);
    dblId=c.id;
    dblTimer=setTimeout(()=>{dblTimer=null;dblId=null;single()},260);
    return;
  }
  if(k==="back"){
    mode="overview";
    ovSel=Math.max(0,visibleCards().findIndex(c=>c.id===stageId));
    render();
  }
}

/* ============================================================
   CARDS — §3 contract + optional renderCompact() (tile view)
   ============================================================ */

/* ---------- semantic color helpers (v7) ----------
   Color carries INFORMATION: temperature scale, weather condition,
   trend direction, source identity, day/night. Frame stays quiet. */
function tempColor(t){
  return t<=-10?"#6EC1FF":t<=0?"#9AD4F5":t<=10?"#7ED0C0":
    t<=20?"#9FE06E":t<=27?"#FFC85E":"#FF7A5C";
}
function wxIcon(code,size){
  size=size||30;
  const P=(body,color)=>"<svg width='"+size+"' height='"+size+
    "' viewBox='0 0 24 24' fill='none' style='vertical-align:middle'>"+
    body.replace(/COL/g,color)+"</svg>";
  const sun="<circle cx='12' cy='12' r='5' fill='COL'/>"+
    "<g stroke='COL' stroke-width='1.6'>"+
    "<path d='M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M19.5 4.5l-2 2M6.5 17.5l-2 2'/></g>";
  const cloud="<path d='M7 18h10a4 4 0 0 0 .8-7.9A5.5 5.5 0 0 0 7.2 9.6 3.8 3.8 0 0 0 7 18z' fill='COL'/>";
  if(code===0||code===1)return P(sun,"#FFD24A");
  if(code===2)return P("<g transform='translate(-2,-2) scale(.7)'>"+
    sun.replace(/COL/g,"#FFD24A")+"</g>"+
    "<g transform='translate(3,4) scale(.9)'>"+cloud+"</g>","#9FB3B8");
  if(code===3||code===45||code===48)return P(cloud,"#9FB3B8");
  if(code>=51&&code<=67||code>=80&&code<=82)
    return P(cloud+"<g stroke='COL' stroke-width='1.8' stroke-linecap='round'>"+
      "<path d='M9 20l-1 2M13 20l-1 2M17 20l-1 2'/></g>","#4FA8E8");
  if(code>=71&&code<=86)
    return P(cloud.replace(/COL/g,"#B8CDD2")+
      "<g fill='COL'><circle cx='9' cy='21' r='1.2'/>"+
      "<circle cx='13' cy='22' r='1.2'/><circle cx='17' cy='21' r='1.2'/>"+
      "</g>","#EAF6FA");
  if(code>=95)
    return P(cloud.replace(/COL/g,"#8A93C8")+
      "<path d='M12 17l-2.5 4h2l-1 3 4-5h-2l1.5-2z' fill='COL'/>","#FFD24A");
  return P(cloud,"#9FB3B8");
}
function dayNightIcon(night,size){
  size=size||22;
  return night?
    "<svg width='"+size+"' height='"+size+"' viewBox='0 0 24 24' "+
    "style='vertical-align:middle'><path d='M20 14A8.5 8.5 0 1 1 10 4"+
    " a7 7 0 0 0 10 10z' fill='#8FB8FF'/></svg>":
    "<svg width='"+size+"' height='"+size+"' viewBox='0 0 24 24' "+
    "style='vertical-align:middle'><circle cx='12' cy='12' r='5' "+
    "fill='#FFD24A'/><g stroke='#FFD24A' stroke-width='1.6'>"+
    "<path d='M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2"+
    "M19.5 4.5l-2 2M6.5 17.5l-2 2'/></g></svg>";
}
function srcColor(name){
  let h=0;for(const ch of String(name||""))h=(h*31+ch.charCodeAt(0))%360;
  return "hsl("+h+" 65% 62%)";
}
function sparkline(vals,w,h){
  if(!vals||vals.length<2)return "";
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>
    (i/(vals.length-1)*w).toFixed(1)+","+
    (h-((v-min)/span)*(h-2)-1).toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  return "<svg width='"+w+"' height='"+h+"' style='vertical-align:middle'>"+
    "<polyline points='"+pts+"' fill='none' stroke='"+
    (up?"var(--up)":"var(--down)")+"' stroke-width='1.5'/></svg>";
}

/* ---- radio: built-in CORS-clean presets + live Greek stations ----
   Presets marked cors:true are known to allow WebAudio analysis
   (real visualizer). Fetched stations default cors:false → they

const RADIO_PRESETS=[
  {label:"RADIO PARADISE",url:"https://stream.radioparadise.com/aac-320",
    cors:true,region:"eclectic"},
  {label:"GROOVE SALAD · SOMAFM",

    cors:true,region:"ambient"},

const cardRadio={
  id:"radio",title:"RADIO",icon:"radio",
  pane:"listen",size:"large",order:50,refresh:3600,offline:"local-first",
  /* Was radio-browser.info, votes-ranked: 7 of its 8 top Greek stations
     were plain http, so they were blocked as mixed content on an https
     page and simply never played. greek-radio.gr is curated, every stream
     is https, and they send CORS headers — so these also get the real
     analyser rather than the synthetic fallback. Sorted by city so the
     list groups instead of arriving in arbitrary order. */
  sources:[{key:"radio.list",origin:"worker",path:"/radio"}],
  sel:0,
  _list(ctx,data){
    const raw=(data&&data["radio.list"])||ctx.cachedOnly("radio.list")||[];
    const gr=(Array.isArray(raw)?raw:[])
      .filter(s=>s&&s.url)
      .map(s=>({label:String(s.label||"STATION").trim().slice(0,30),
        url:s.url,cors:true,region:(s.city||"greece").trim(),
        meta:String(s.meta||"").trim()}))

  },
  render(ctx,data){
    const list=this._list(ctx,data);
    const cur=ctx.audio.current();
    return list.map((st,i)=>{
      const now=cur&&cur.url===st.url;
      const bad=ctx.audio.failed()===st.url;
      const rc=srcColor(st.region);
      /* http streams cannot play on an https page unless the host allows
         mixed content (our WebView wrapper does; a plain browser will not) */
      const insecure=/^http:\/\//i.test(st.url);
      return "<div class='row"+(i===this.sel?" hl sel":"")+
        "' data-row='"+i+"'>"+
        "<span class='"+(i===this.sel?"":"lbl")+"'>"+
        (now?"<span style='color:var(--up)'>▶ </span>":"")+
        (bad?"<span style='color:var(--down)'>⚠ </span>":"")+

      "temporarily down; try another":
      cur?"playing — OK on station stops/switches · "+
        "double-OK the tile to stop from anywhere":
      "▲▼ choose · OK play · "+
        "double-OK the tile plays this one without opening")+"</div>";
  },
  renderCompact(ctx){
    const cur=ctx.audio.current();
    if(cur)return face("▶",esc(cur.label),
      {color:"var(--up)",sub:esc(cur.region||"")});
    const list=this._list(ctx,this._data);
    const regions=[];
    list.forEach(s=>{if(regions.indexOf(s.region)<0)regions.push(s.region)});
    return face(list.length,"stations",{dots:regions.map(srcColor)});
  },
  onKey(ctx,k){
    const list=this._list(ctx,this._data);
    if(k==="down"&&this.sel<list.length-1){this.sel++;ctx.rerender();
      return true}
    if(k==="up"&&this.sel>0){this.sel--;ctx.rerender();return true}
    if(k==="enter"&&list[this.sel]){
      ctx.audio.toggle(list[this.sel]);
      render(); /* now-playing shows on radio + visualizer tiles */

     on, without opening the card at all. audio.toggle() already stops when
     handed the stream that is playing, so this is one call. */
  onToggle(ctx){

    if(!st)return;

/* ---- visualizer: canvas styles over the shared analyser ----
   Style registry mirrors the whole system's philosophy (§8):
   each style = {id,draw(ctx2d,w,h,levels,accent)}. OK cycles.  */
const VIS_STYLES=[
  {id:"bars",_pk:null,draw(g,w,h,lv){
    /* frequency → hue: low=magenta through cyan to high=amber */
    const n=lv.length,bw=w/n;
    const bar=Math.max(1,bw-1);          /* 1px gutter, however many bars */
    /* peak caps that fall slowly — the thing that makes a spectrum read as
       an instrument rather than a bar chart */
    if(!this._pk||this._pk.length!==n)this._pk=new Float32Array(n);
    const pk=this._pk;
    for(let i=0;i<n;i++){
      const v=lv[i];
      if(v>pk[i])pk[i]=v; else pk[i]=Math.max(v,pk[i]-0.014);
      const hue=300-(i/n)*260;
      const bh=Math.max(1,v*h*0.92);
      g.globalAlpha=0.35+0.65*v;
      g.fillStyle="hsl("+hue+" 88% "+(46+v*26)+"%)";
      g.fillRect(i*bw,h-bh,bar,bh);
      if(pk[i]>0.02){
        g.globalAlpha=0.9;
        g.fillStyle="hsl("+hue+" 95% 74%)";
        g.fillRect(i*bw,h-Math.max(2,pk[i]*h*0.92),bar,1.5);
      }
    }
    g.globalAlpha=1;
  }},
  {id:"pulse",draw(g,w,h,lv){
    const cx=w/2,cy=h/2;
    const avg=lv.reduce((a,b)=>a+b,0)/lv.length;
    for(let ring=0;ring<5;ring++){
      const v=lv[(ring*6)%lv.length];
      const r=(0.12+ring*0.17+avg*0.25)*Math.min(w,h)/2;
      g.strokeStyle="hsl("+(190+ring*38)+" 85% "+(50+v*20)+"%)";
      g.globalAlpha=0.2+0.6*v;
      g.lineWidth=1+3*v;
      g.beginPath();g.arc(cx,cy,r,0,2*Math.PI);g.stroke();
    }
    g.globalAlpha=1;
  }},
  {id:"scope",draw(g,w,h,lv){
    for(let i=1;i<lv.length;i++){
      const x0=(i-1)/(lv.length-1)*w,x1=i/(lv.length-1)*w;
      const y0=h/2+(lv[i-1]-0.4)*h*0.7*((i-1)%2?1:-1);
      const y1=h/2+(lv[i]-0.4)*h*0.7*(i%2?1:-1);
      g.strokeStyle="hsl("+(300-(i/lv.length)*260)+" 85% 58%)";
      g.globalAlpha=0.9;g.lineWidth=1.5;
      g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    }
    g.globalAlpha=1;
  }}
];
const cardVis={
  id:"vis",title:"VISUALIZER",icon:"wave",
  pane:"listen",size:"large",order:55,refresh:null,offline:"cached",
  styleIdx:0,_raf:null,_levels:new Float32Array(32),
  init(ctx){
    this.styleIdx=ctx.storage.get("style",0)%VIS_STYLES.length;
    let last=0;
    /* The old loop ran at 60fps forever, including the whole time the
       visualiser was not even on stage. Now: ~30fps while it is visible
       (ample for a spectrum), and a lazy poll when it is not, so a card
       nobody is looking at costs nothing while audio plays. */
    const tick=ts=>{
      const cv=document.getElementById("vis-cv");
      if(!cv){this._raf=setTimeout(tick,500);return}
      if(!ts||ts-last>=33){last=ts||0;this._draw(ctx,cv)}
      this._raf=(window.requestAnimationFrame||
        (f=>setTimeout(f,33)))(tick);
    };
    tick();
  },
  _draw(ctx,cv){
    cv=cv||document.getElementById("vis-cv");
    if(!cv)return;
    let g=null;try{g=cv.getContext&&cv.getContext("2d")}catch(e){}
    if(!g)return;
    /* Assigning canvas.width reallocates and clears the backing store, and
       reading clientWidth forces layout — doing both every frame was the
       single most expensive thing on screen. Only resize when it changed. */
    const w=cv.clientWidth||600,h=cv.clientHeight||220;
    if(cv.width!==w)cv.width=w;
    if(cv.height!==h)cv.height=h;
    /* Bar count follows the canvas instead of a fixed 32: roughly one bar
       per 5px, so the stage gets ~130 narrow bars and the fullscreen view
       more still, rather than 32 fat ones stretched to fit. */
    const want=Math.max(24,Math.min(192,Math.round(w/5)));
    if(this._levels.length!==want)this._levels=new Float32Array(want);
    g.clearRect(0,0,w,h);
    const real=ctx.audio.getLevels(this._levels);
    VIS_STYLES[this.styleIdx].draw(g,w,h,this._levels);
    const tag=document.getElementById("vis-tag");
    if(tag)tag.textContent=VIS_STYLES[this.styleIdx].id+
      (ctx.audio.playing()?(real?" · live fft":" · synthetic"):" · idle");
  },
  render(ctx){
    const cur=ctx.audio.current();
    return "<canvas id='vis-cv' data-row='0' style='width:100%;height:230px;"+
      "display:block'></canvas>"+
      "<div class='state' style='display:flex;justify-content:"+
      "space-between;margin-top:8px'><span id='vis-tag'>"+
      VIS_STYLES[this.styleIdx].id+"</span><span>"+
      (cur?esc(cur.label):"no audio — OK cycles style")+"</span></div>";
  },
  renderCompact(ctx){
    const on=ctx.audio.playing();
    return face(VIS_STYLES[this.styleIdx].id,on?"live spectrum":"idle",
      {color:on?"var(--accent)":null});
  },
  onKey(ctx,k){
    if(k==="enter"){this._cycle(ctx);return true}
    return false;
  },
  _cycle(ctx){
    this.styleIdx=(this.styleIdx+1)%VIS_STYLES.length;
    ctx.storage.set("style",this.styleIdx);
    ctx.rerender();
  },
  onPick(ctx){this._cycle(ctx)}
};


/* ---- claude: assistant chat — see it big, hear it spoken ----
   Input arrives from the phone companion (primary) or the TV
   keyboard field. Requests go to YOUR Worker's /claude endpoint,
   which holds the Anthropic API key as a secret — the key never
   exists client-side. Replies render on the glasses and are
   spoken via speechSynthesis when voice is on (OK toggles).    */
const cardClaude={
  id:"claude",title:"CLAUDE",icon:"chat",
  pane:"assist",size:"large",order:45,refresh:null,offline:"live-only",
  accepts:["chat"],
  msgs:[],busy:false,voice:true,scroll:0,
  init(ctx){this.voice=ctx.storage.get("voice",true);
    this.msgs=ctx.storage.get("msgs",[])},
  _speak(text){
    if(!this.voice)return;
    try{
      if(typeof speechSynthesis==="undefined")return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.slice(0,600));
      speechSynthesis.speak(u);
    }catch(e){}
  },
  async _send(ctx,text){
    text=String(text||"").trim();
    if(!text||this.busy)return;
    if(!WORKER_BASE()){ctx.rerender();return}
    this.msgs.push({role:"user",content:text});
    this.busy=true;this.scroll=0;ctx.rerender();
    try{
      const r=await fetch(WORKER_BASE().replace(/\/$/,"")+"/claude",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:this.msgs.slice(-12)})});
      if(!r.ok)throw new Error("http-"+r.status);
      const d=await r.json();
      const reply=(d&&d.reply)||"(empty reply)";
      this.msgs.push({role:"assistant",content:reply});
      this._speak(reply);
    }catch(e){
      this.msgs.push({role:"assistant",
        content:"⚠ relay error — "+e.message});
    }
    this.busy=false;
    this.msgs=this.msgs.slice(-20);
    ctx.storage.set("msgs",this.msgs);
    ctx.rerender();
  },
  onText(ctx,v){this._send(ctx,v)},
  onInject(ctx,item){if(item.kind==="chat")this._send(ctx,item.v)},
  render(ctx){
    if(!WORKER_BASE())
      return "<div class='state'>Claude needs your <b>Worker URL</b> "+
        "(system card). The Worker's <span class='val'>/claude</span> "+
        "endpoint holds your Anthropic API key server-side.</div>";
    const shown=this.msgs.slice(-(6+this.scroll),
      this.msgs.length-this.scroll||undefined);
    const log=shown.map(m=>{
      const me=m.role==="user";
      return "<div class='hl' style='border-left:2px solid "+
        (me?"var(--faint)":"var(--accent)")+";padding-left:10px'>"+
        "<span class='src'>"+(me?"YOU":"CLAUDE")+"</span>"+
        esc(m.content)+"</div>";
    }).join("")||"<div class='state'>Ask from the paired phone "+
      "(room "+esc(companion.code())+") or type below.</div>";
    return log+
      (this.busy?"<div class='state'>thinking…</div>":"")+
      "<input type='text' id='claude-in' placeholder='ask claude…' "+
      "style='margin-top:10px'>"+
      "<div class='state' style='margin-top:6px'>voice "+
      (this.voice?"ON":"OFF")+" — OK toggles · ▲▼ scroll · link "+
      (companion.state()==="on"?"●":"○")+" "+esc(companion.code())+
      "</div>";
  },
  /* the old version pasted 60 raw characters of a reply into the tile and
     let the box crop them; report state and volume instead */
  renderCompact(ctx){
    if(!WORKER_BASE())return face("—","needs worker URL");
    if(this.busy)return face("…","thinking",{color:"var(--accent)"});
    const n=this.msgs.filter(m=>m.role==="assistant").length;
    return n?face(n,"replies · room "+esc(companion.code()))
            :face("READY","room "+esc(companion.code()));
  },
  onKey(ctx,k){
    if(k==="enter"){this.voice=!this.voice;
      ctx.storage.set("voice",this.voice);
      if(!this.voice&&typeof speechSynthesis!=="undefined")
        {try{speechSynthesis.cancel()}catch(e){}}
      ctx.rerender();return true}
    if(k==="up"&&this.scroll<Math.max(0,this.msgs.length-6))
      {this.scroll++;ctx.rerender();return true}
    if(k==="down"&&this.scroll>0){this.scroll--;ctx.rerender();
      return true}
    return false;
  }
};

/* ---- launch: web bookmarks — the box's missing browser home ----
   OK opens the selected site full-screen (BACK returns to AMBIENT;
   state persists, the shell is service-worker cached). Add sites via
   the field (TV keyboard) as "url" or "label|url", or paste a URL
   from the paired phone (inject kind:url lands here). ---- */
const cardLaunch={
  id:"launch",title:"LAUNCH",icon:"globe",
  pane:"web",size:"large",order:60,refresh:null,offline:"live-only",
  accepts:["url"],sel:0,
  _links(ctx){return ctx.storage.get("links",[
    {label:"YOUTUBE",url:"https://www.youtube.com"},
    {label:"WIKIPEDIA",url:"https://www.wikipedia.org"}
  ])},
  _add(ctx,v){
    v=String(v||"").trim();if(!v)return;
    let label=null,url=v;
    if(v.includes("|")){const p=v.split("|");label=p[0].trim();
      url=p.slice(1).join("|").trim()}
    if(!/^https?:\/\//i.test(url))url="https://"+url;
    try{label=label||new URL(url).hostname.replace(/^www\./,"")
      .toUpperCase()}catch(e){return}
    const links=this._links(ctx);
    links.push({label:label.toUpperCase().slice(0,24),url});
    ctx.storage.set("links",links.slice(0,12));
    ctx.rerender();
  },
  onInject(ctx,item){if(item.kind==="url")this._add(ctx,item.v)},
  render(ctx){
    const links=this._links(ctx);
    return links.map((l,i)=>{
      let host="";try{host=new URL(l.url).hostname}catch(e){}
      return "<div class='row"+(i===this.sel?" hl sel":"")+
        "' data-row='"+i+"'>"+
        "<span class='"+(i===this.sel?"":"lbl")+"'>"+esc(l.label)+
        "</span><span style='color:"+srcColor(host)+
        ";font-size:12px'>"+esc(host)+"</span></div>";
    }).join("")+
    "<input type='text' id='launch-in' placeholder='add: url  or  label|url'"+
    " style='margin-top:10px'>"+
    "<div class='state' style='margin-top:6px'>▲▼ choose · OK open "+
    "full-screen · BACK in the browser returns here · paste a link from "+
    "the phone to add it</div>";
  },
  renderCompact(ctx){
    const links=this._links(ctx);
    const dots=links.map(l=>{
      let h="";try{h=new URL(l.url).hostname}catch(e){}
      return srcColor(h);
    });
    return face(links.length,"sites",{dots});
  },
  onKey(ctx,k){
    const links=this._links(ctx);
    if(k==="down"&&this.sel<links.length-1){this.sel++;ctx.rerender();
      return true}
    if(k==="up"&&this.sel>0){this.sel--;ctx.rerender();return true}
    if(k==="enter"&&links[this.sel]){
      try{location.assign(links[this.sel].url)}catch(e){}
      return true;
    }
    return false;
  },
  onPick(ctx,i){
    const links=this._links(ctx);
    if(!links[i])return;
    this.sel=i;
    try{location.assign(links[i].url)}catch(e){}
  },
  init(ctx){
    document.addEventListener("change",e=>{
      if(e.target&&e.target.id==="launch-in"&&e.target.value.trim()){
        const v=e.target.value.trim();e.target.value="";
        this._add(ctx,v);
      }
    });
  }
};

/* ---- scenes: apply a saved composition (spec §5) ---- */
const cardScenes={
  id:"scenes",title:"SCENES",icon:"layers",
  pane:"system",size:"medium",order:80,refresh:null,offline:"cached",
  sel:0,
  render(ctx){
    const list=allScenes();
    return list.map((sc,i)=>{
      const on=sc.id===currentScene;
      return "<div class='row"+(i===this.sel?" hl sel":"")+
        "' data-row='"+i+"'>"+
        "<span class='"+(i===this.sel?"":"lbl")+"'>"+
        (on?"● ":"")+esc(sc.name)+"</span>"+
        "<span class='lbl'>"+esc(sc.palette||"")+"</span></div>";
    }).join("")+
    "<div class='state' style='margin-top:10px'>▲▼ choose · OK apply"+
    "<br>overview: OK on a dimmed panel re-adds it</div>";
  },
  renderCompact(){
    const sc=allScenes().find(s=>s.id===currentScene);
    return face(esc(sc?sc.name:"—"),"active scene");
  },
  onKey(ctx,k){
    const list=allScenes();
    if(k==="down"&&this.sel<list.length-1){this.sel++;ctx.rerender();
      return true}
    if(k==="up"&&this.sel>0){this.sel--;ctx.rerender();return true}
    if(k==="enter"){applyScene(list[this.sel]);return true}
    return false;
  },
  onPick(ctx,i){
    const list=allScenes();
    if(list[i]){this.sel=i;applyScene(list[i])}
  }
};

const cardSystem={
  id:"system",title:"SYSTEM",icon:"gear",
  pane:"system",size:"large",order:90,refresh:null,offline:"cached",
  render(ctx){
    const chips=Object.keys(THEMES).map((n,i)=>"<span class='chip"+
      (n===ctx.theme()?" on":"")+"' data-row='"+i+"'>"+n+
      "</span>").join("");
    return "<div class='lbl'>palette — OK cycles</div>"+
      "<div class='chips'>"+chips+"</div>"+
      "<div class='lbl' style='margin-top:16px'>feed relay "+
      "(Cloudflare Worker URL) — ▼ to edit, BACK when done</div>"+
      "<input type='text' id='worker-in' value='"+esc(WORKER_BASE())+
      "' placeholder='https://your-worker.workers.dev'>"+
      "<div class='lbl' style='margin-top:14px'>"+APP_VERSION+
      " · cards "+CARDS.length+" · "+(online?"online":"offline")+
      " · room "+esc(companion.code())+"</div>"+
      "<div class='state' style='margin-top:10px'>"+
      "◄ ► ▲ ▼ move between tiles · OK open · OK again fullscreen<br>"+
      "double-OK a RADIO tile starts/stops it without opening<br>"+
      "in a card: ▲ ▼ / OK act · BACK back to tiles · BACK again "+
      "overview</div>";
  },
  renderCompact(ctx){
    return face(ctx.theme(),APP_VERSION+" · "+CARDS.length+" cards");
  },
  onKey(ctx,k){
    if(k==="enter"){
      const names=Object.keys(THEMES);
      const next=names[(names.indexOf(ctx.theme())+1)%names.length];
      ctx.setTheme(next);render();return true;
    }
    return false;
  },
  onPick(ctx,i){
    const names=Object.keys(THEMES);
    if(names[i]){ctx.setTheme(names[i]);render()}
  },
  init(ctx){
    document.addEventListener("change",e=>{
      if(e.target&&e.target.id==="worker-in"){
        localStorage.setItem("ambient.worker",e.target.value.trim());
        CARDS.forEach(c=>refreshCard(c,true));
        /* refreshCard returns early for cards with no sources, so CLAUDE
           and LAUNCH kept showing "needs worker URL" after it was set.
           Repaint the whole frame, not just the fetching cards. */
        render();
        companion.connect();   /* the relay lives on the same worker */
      }
    });
  }
};

/* ---------------- boot ---------------- */
registerCards([cardClock,cardWeather,cardMarkets,cardHeadlines,
  cardClaude,cardRadio,cardVis,cardLaunch,cardScenes,cardSystem]);
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="claude-in"&&e.target.value.trim()){
    const v=e.target.value.trim();e.target.value="";
    cardClaude._send(ctxFor(cardClaude),v);
  }
});
applyScene(allScenes().find(sc=>sc.id===currentScene)||SCENES[0]);
setOnline(navigator.onLine);
companion.connect();
on("companion",()=>{const c=staged();
  if(c&&c.id==="claude")renderCard(c)});
on("audio",p=>{
  const el=document.getElementById("st-audio");
  if(el)el.textContent=(p.state==="play"&&p.item)?
    "♪ "+p.item.label:"";
  /* a stream that failed to start must repaint the list, or the ⚠ marker
     and the explanation never appear */
  if(p.state==="error")render();
});
render();
CARDS.forEach(c=>refreshCard(c,true));

/* ---------------- update channel ----------------
   This runs unattended on a device with no address bar and no reload
   button, so a deploy has to arrive by itself. Three parts:

   updateViaCache:"none" — revalidate sw.js against the network on every
     update check rather than reusing the HTTP-cached copy (GitHub Pages
     serves max-age=600, which otherwise hides a deploy for 10 minutes).
   reg.update()          — the TCL browser does not reliably run its own
     update check on navigation (observed: v14 pushed, two reloads, still
     serving v13), so ask explicitly on load and on a timer.
   controllerchange      — when the new worker claims the page the shell
     on disk has changed underneath us, so reload once to match it.

   The reload is deferred while audio is playing: losing a radio stream
   to a background deploy would be worse than applying it a bit later. */
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let reloading=false,pending=false;
  const apply=()=>{
    if(reloading)return;
    if(audioBus.playing()){pending=true;return} /* wait for silence */
    reloading=true;location.reload();
  };
  on("audio",p=>{if(p.state==="stop"&&pending)apply()});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    /* first install claims an uncontrolled page — nothing stale to fix */
    if(hadController)apply();
  });
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})
    .then(reg=>{
      reg.update();
      setInterval(()=>{try{reg.update()}catch(e){}},10*60*1000);
    })
    .catch(()=>{});
}
